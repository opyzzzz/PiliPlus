name: Sync upstream tags

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run tag sync or audit existing patched tags"
        type: choice
        options:
          - sync
          - audit
        default: sync
        required: true
      dry_run:
        description: "Dry run (do not push anything; sync mode only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync-tags:
    name: Sync or audit upstream tags
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_URL: https://github.com/bggRGjQaUbCoE/PiliPlus.git
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main-test
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"

      - name: Validate sync script syntax
        shell: bash
        run: bash -n scripts/sync-upstream-tags.sh

      - name: Sync or audit tags
        env:
          BASELINE_TAG: "2.1.6.2"
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'sync' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: bash
        run: bash scripts/sync-upstream-tags.sh

      - name: Report failure
        if: failure() || cancelled()
        shell: bash
        run: |
          msg="Tag sync/audit failed. See job logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "$msg" >&2
          {
            echo ""
            echo "---"
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
